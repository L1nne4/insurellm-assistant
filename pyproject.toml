[project]
name = "insurellm-rag"
version = "0.1.0"
description = "Knowledge assistant for the Insurellm document corpus, with semantic chunking, query rewriting, and reranking."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.1.0",
    "gradio>=5.47.2,<6.0",
    "litellm>=1.77.5",
    "openai>=1.109.1",
    "pandas>=2.3.3",
    "pydantic>=2.0",
    "python-dotenv>=1.1.1",
    "tenacity>=9.0.0",
    "tqdm>=4.67.1",
]
